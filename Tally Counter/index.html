<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tally Counter</title>
    <style>
        div{
            display: block;
            justify-content: center;
            align-items: center;
        }

        h1{
            font-size: 15rem;
            align-self: center;
            justify-self: center;
        }

        button{
            padding: 5rem 100%;
            font-size: 5rem;
        }
    </style>
</head>
<body>
    <div>    
        <h1 id="TheNumberText">0</h1>
        <button id="TheButton">+</button>
    </div>
    <script>
        button = document.getElementById("TheButton");
        text = document.getElementById("TheNumberText");

        number=0;
        targettedNumber = prompt("Give a target number");

        TheButton.addEventListener("click", () => {
            number++;
            text.innerHTML = number;
            if (targettedNumber>0){
                if (number == targettedNumber){
                text.style.color = "red";
                }
            } 
});
    </script>

</body>
</html>
