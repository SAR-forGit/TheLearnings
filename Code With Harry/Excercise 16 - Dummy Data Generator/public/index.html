<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Employee Generator</title>
</head>

<body>
    <h1>Employee Generator</h1>
    <button id="GenrateBtn">Generate an Employee</button>
    <div id="employeeinfoPlace"></div>

    <script>
        const button = document.getElementById("GenrateBtn"),
            employeeDiv = document.getElementById("employeeinfoPlace");

        button.addEventListener("click", async () => {
            const response = await fetch("/generate", { method: "POST" });

            const data = await response.json();
            // const employee = data.employee;

            employeeDiv.innerHTML = `
                    <h2>${data.employee.name}</h2>
                    <p>salary: ${data.employee.salary}</p>
                    <p>language: ${data.employee.language}</p>
                    <p>city: ${data.employee.city}</p>
                    <p>isManager: ${data.employee.isManager}</p>
                    `
        });
    </script>
</body>

</html>
