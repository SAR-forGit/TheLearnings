<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Practise</title>
</head>

<body style="background-color: #FFE5B4;">
    <marquee direction="right"><h1>Your Form Niggesh:</h1></marquee>
    <form action="" method="post">
        <div>
            <h2 style="margin-bottom: 0;">Enter your username:</h2>
            <input style="background-color: gray; color: white; padding: 0.5rem;" type="text" name="username"
                placeholder="Enter your username" id="">
        </div>
        <div>
            <h2 style="margin-bottom: 0;">Select your gender:</h2>
            <input type="radio" name="gender" id="Male">
            <label for="Male">Male</label>
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
        </div>
        <div>
            <input type="checkbox" id="Subscribe">
            <label for="Subscribe">Did you subscribe?</label>
        </div>
        <div style="display: flex; flex-direction: column;">
            <h2 style="margin-bottom: 0;">Tell us more about you</h2>
            <textarea id="Textareafor" name="Comment" id="" cols="30" rows="10" placeholder="Enter your text here"></textarea>
        </div>
        <div>
            <select name="Fruits" id="">
                <option value="Apple">Apple</option>
                <option value="Banan">Banana</option>
                <option value="Cherr">Cherry</option>
            </select>
        </div>
    </form>
</body>

</html>
